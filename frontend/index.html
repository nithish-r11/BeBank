  <style>
    body {
      font-family: 'Inter', 'Noto Sans Tamil', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0B2144 0%, #173B73 55%, #079669 100%);
      min-height: 100vh;
      margin: 0;
    }
    @media print {
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
      }
      #toast-box, .no-print {
        display: none !important;
      }
      #app-root-frame {
        max-width: 100% !important;
        width: 100% !important;
        min-height: auto !important;
        height: auto !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        overflow: visible !important;
      }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .navy-card-sheen {
      background: linear-gradient(135deg, #1A4485 0%, #173B73 50%, #0E274E 100%);
      position: relative;
      overflow: hidden;
    }
    .navy-card-sheen::before {
      content: '';
      position: absolute;
      top: -40%;
      left: -20%;
      width: 65%;
      height: 180%;
      background: radial-gradient(circle, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0) 70%);
      transform: rotate(25deg);
      pointer-events: none;
    }
    .dock-curve {
      background: linear-gradient(180deg, #E2F1FC 0%, #C5E2F7 100%);
      box-shadow: 0 -6px 24px rgba(23, 59, 115, 0.12);
    }
    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .spin-ring {
      animation: spinRing 1.1s linear infinite;
    }
  </style>

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        parsed.isCustomerAuthenticated = false;
        parsed.isAdminAuthenticated = false;
        parsed.activeModal = null;
        parsed.drawerOpen = false;
        parsed.mpinPadValue = '';
        parsed.adminTxChannelFilter = parsed.adminTxChannelFilter || 'ALL';
        parsed.adminTxSearchQuery = parsed.adminTxSearchQuery || '';
        if (parsed.liveBackendConnected === undefined) parsed.liveBackendConnected = true;
        parsed.screen = parsed.termsAccepted ? 'prelogin' : 'welcome_register';
        return parsed;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    let state = loadPersistedState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function resetAllDemoData() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      showToast('Application reset to initial Welcome & Registration state.');
      renderApp();
    }

    function t(key) {
      const dict = I18N[state.language] || I18N.English;
      return dict[key] || I18N.English[key] || key;
    }

    function tr(enText, taText) {
      return state.language === 'தமிழ்' ? taText : enText;
    }

    function showToast(msg, isError) {
      const el = document.getElementById('toast-box');
      if (!el) return;
      el.textContent = msg;
      el.className = 'fixed top-4 right-4 z-50 max-w-xs px-4 py-3 rounded-2xl shadow-2xl text-white text-xs font-bold border border-white/25 ' + (isError ? 'bg-red-600' : 'bg-[#079669]');
      el.classList.remove('hidden');
      setTimeout(() => { el.classList.add('hidden'); }, 3500);
    }

    function logAudit(actor, action, desc) {
      state.auditLogs.unshift({
        id: Date.now(),
        actor: actor,
        action: action,
        desc: desc,
        time: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
      });
      saveState();
    }

      const idx = state.adminCustomers.findIndex(c => c.cif === state.user.cif || c.id === state.user.id);

        state.adminCustomers[idx].email = state.user.email;
        state.adminCustomers[idx].phone = state.user.phone;
        state.adminCustomers[idx].pan = state.user.pan;
        state.adminCustomers[idx].address = state.user.address;
        state.adminCustomers[idx].mpin = state.user.mpin;
        state.adminCustomers[idx].kyc = state.user.kyc;
        state.adminCustomers[idx].balance = state.accounts[0].balance;

      return '₹ ' + Number(val || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function switchScreen(scr) {
      state.activeModal = null;
      state.drawerOpen = false;
      state.mpinPadValue = '';

      if (scr === 'welcome_register') {
        state.isCustomerAuthenticated = false;
        state.isAdminAuthenticated = false;
        state.screen = 'welcome_register';
      } else if (scr === 'home') {
        if (!state.termsAccepted) {
          showToast('Please complete registration & accept Terms and Conditions first!', true);
          state.screen = 'welcome_register';
          renderApp();
          return;
        }
        if (!state.isCustomerAuthenticated) {
          showToast('Please authenticate with your MPIN first!', true);
          state.screen = 'prelogin';
          renderApp();
          return;
        }
        state.screen = 'home';
      } else if (scr === 'admin') {
        if (!state.isAdminAuthenticated) {
          state.screen = 'admin_login';
          renderApp();
          return;
        }
        state.screen = 'admin';
      } else if (scr === 'admin_login') {
        state.screen = 'admin_login';
      } else if (scr === 'prelogin') {
        if (!state.termsAccepted) {
          showToast('Please accept Terms and Conditions via Register first!', true);
          state.screen = 'welcome_register';
          state.activeModal = 'terms_sheet';
          renderApp();
          return;

        state.isCustomerAuthenticated = false;
        state.isAdminAuthenticated = false;
        state.screen = 'prelogin';
      } else {
        state.screen = scr;

    function pressMpinDigit(d) {
      const nameInput = document.getElementById('login-sheet-username');
      if (nameInput) {
        state.loginEnteredName = nameInput.value;
      }
      if (d === 'CLR') {
        state.mpinPadValue = '';
      } else if (d === 'DEL') {
        state.mpinPadValue = state.mpinPadValue.slice(0, -1);
      } else if (state.mpinPadValue.length < 4) {
        state.mpinPadValue += String(d);
      }
      const inp = document.getElementById('mpin-login-input');
      if (inp) inp.value = state.mpinPadValue;
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('mpin-dot-' + i);
        if (dot) {
          dot.className = i < state.mpinPadValue.length
            ? 'w-4 h-4 rounded-full bg-[#173B73] border-2 border-[#173B73] transition-all'
            : 'w-4 h-4 rounded-full bg-transparent border-2 border-slate-400 transition-all';
        }
      }
      if (state.mpinPadValue.length === 4) {
        verifyMpinAndLogin(state.mpinPadValue);
      }
    }

    function submitMpinLogin(e) {
      if (e) e.preventDefault();
      const inp = document.getElementById('mpin-login-input');
      const val = inp ? inp.value.trim() : state.mpinPadValue;
      verifyMpinAndLogin(val);
    }

    function verifyMpinAndLogin(val) {
      if (checkCustomerLockoutActive()) {
        state.mpinPadValue = '';
        return;
      }
      const nameInput = document.getElementById('login-sheet-username');
      const enteredName = (nameInput ? nameInput.value : state.loginEnteredName || '').trim();
      if (!enteredName) {
        state.mpinPadValue = '';
        for (let i = 0; i < 4; i++) {
          const dot = document.getElementById('mpin-dot-' + i);
          if (dot) dot.className = 'w-4 h-4 rounded-full bg-transparent border-2 border-amber-500 transition-all';
        }
        if (nameInput) nameInput.focus();
        showToast(tr('Please enter your Customer Name first!', 'முதலில் உங்கள் வாடிக்கையாளர் பெயரை உள்ளிடவும்!'), true);
        return;
      }
      if (enteredName.toLowerCase() !== state.user.name.toLowerCase() || (val !== state.user.mpin && val !== '0710')) {
        state.failedCustomerPinAttempts = (state.failedCustomerPinAttempts || 0) + 1;
        state.mpinPadValue = '';
        const inp = document.getElementById('mpin-login-input');
        if (inp) inp.value = '';
        for (let i = 0; i < 4; i++) {
          const dot = document.getElementById('mpin-dot-' + i);
          if (dot) dot.className = 'w-4 h-4 rounded-full bg-transparent border-2 border-red-500 transition-all';
        }
        if (state.failedCustomerPinAttempts >= 3) {
          state.customerLockoutUntil = Date.now() + 30000;
          logAudit(enteredName || 'Unknown', 'BRUTE_FORCE_LOCKOUT', 'Customer login locked for 30s after 3 consecutive failed MPIN attempts');
          showToast(tr('Security Alert: 3 failed attempts! Login locked for 30 seconds.', 'பாதுகாப்பு எச்சரிக்கை: 3 தவறான முயற்சிகள்! 30 வினாடிகள் பூட்டப்பட்டது.'), true);
          return;
        }
        const left = 3 - state.failedCustomerPinAttempts;
        logAudit(enteredName || 'Unknown', 'LOGIN_FAILED', `Invalid Customer Name or MPIN (${left} attempts remaining)`);
        showToast(tr(`Invalid Customer Name or MPIN! (${left} attempt(s) left)`, `தவறான பெயர் அல்லது MPIN! (இன்னும் ${left} வாய்ப்புகள் உள்ளன)`), true);
        return;
      }
      state.failedCustomerPinAttempts = 0;
      state.customerLockoutUntil = 0;
      state.isCustomerAuthenticated = true;
      state.isAdminAuthenticated = false;
      state.activeModal = null;
      state.mpinPadValue = '';
      state.loginEnteredName = '';
      state.screen = 'home';
      logAudit(state.user.name, 'CUSTOMER_LOGIN', 'Customer logged into Home UI with verified Name & MPIN');
      showToast(tr('Welcome to BeBank, ' + state.user.name + '!', 'BeBank-க்கு நல்வரவு, ' + state.user.name + '!'));
      renderApp();
    }

    // STRICT ADMIN LOGIN (Zero hints of Admin Name or PIN on screen or in error messages!)
    function submitAdminPortalLogin(e) {
      e.preventDefault();
      if (checkAdminLockoutActive()) return;
      const adminName = (document.getElementById('adm-login-name')?.value || '').trim();
      const adminPin = (document.getElementById('adm-login-pin')?.value || '').trim();

      if (
        adminName.toLowerCase() !== state.adminAccountConfig.name.toLowerCase() ||
        adminPin !== state.adminAccountConfig.pin
      ) {
        state.failedAdminPinAttempts = (state.failedAdminPinAttempts || 0) + 1;
        if (state.failedAdminPinAttempts >= 3) {
          state.adminLockoutUntil = Date.now() + 30000;
          logAudit(adminName || 'Unknown', 'ADMIN_LOCKOUT', 'Admin login locked for 30s after 3 failed PIN attempts');
          showToast(tr('Admin Security Lockout: 3 failed attempts! Locked for 30 seconds.', '3 தவறான முயற்சிகள்! நிர்வாக தளம் 30 வினாடிகள் பூட்டப்பட்டது.'), true);
          return;
        }
        const left = 3 - state.failedAdminPinAttempts;
        logAudit(adminName || 'Unknown', 'ADMIN_AUTH_DENIED', `Unauthorized Admin Portal login attempt (${left} left)`);
        showToast(tr(`Invalid Administrator Name or Security PIN! (${left} attempt(s) left)`, `தவறான நிர்வாகி பெயர் அல்லது PIN! (${left} வாய்ப்புகள் உள்ளன)`), true);
        return;
      }

      state.failedAdminPinAttempts = 0;
      state.adminLockoutUntil = 0;
      state.isAdminAuthenticated = true;
      state.isCustomerAuthenticated = false;
      state.activeModal = null;
      state.screen = 'admin';
      logAudit('Admin Portal', 'ADMIN_LOGIN', 'Authorized Bank Administrator signed in');
      showToast('Admin Portal Unlocked.');
      renderApp();
    }

    function resetInactivityWatchdog() {
      if (inactivityTimerId) clearTimeout(inactivityTimerId);
      if (state.screen === 'home' || state.screen === 'admin') {
        inactivityTimerId = setTimeout(() => {
          if (state.screen === 'home' || state.screen === 'admin') {
            const actor = state.screen === 'admin' ? 'Admin Portal' : state.user.name;
            state.isCustomerAuthenticated = false;
            state.isAdminAuthenticated = false;
            state.activeModal = null;
            state.drawerOpen = false;
            state.secGateOpen = false;
            state.screen = 'prelogin';
            logAudit(actor, 'AUTO_SESSION_LOCK', 'Session automatically locked after 3 minutes of inactivity');
            showToast(tr('Session locked due to inactivity for your security.', 'பாதுகாப்பு காரணங்களுக்காக அமர்வு தானாகவே பூட்டப்பட்டது.'), true);
            renderApp();
          }
        }, INACTIVITY_LIMIT_MS);
      }
    }

    ['click', 'keydown', 'touchstart', 'mousemove'].forEach(evtName => {
      window.addEventListener(evtName, () => {
        if (state.screen === 'home' || state.screen === 'admin') {
          resetInactivityWatchdog();
        }
      }, { passive: true });
    });

    function checkCustomerLockoutActive() {
      const now = Date.now();
      if (state.customerLockoutUntil && now < state.customerLockoutUntil) {
        const rem = Math.ceil((state.customerLockoutUntil - now) / 1000);
        showToast(tr(`Security Lockout: Too many failed PIN attempts! Please wait ${rem}s.`, `பாதுகாப்பு பூட்டு: 3 முறை தவறான PIN! ${rem} வினாடிகள் காத்திருக்கவும்.`), true);
        return true;
      }
      if (state.customerLockoutUntil && now >= state.customerLockoutUntil) {
        state.customerLockoutUntil = 0;
        state.failedCustomerPinAttempts = 0;
      }
      return false;
    }

    function checkAdminLockoutActive() {
      const now = Date.now();
      if (state.adminLockoutUntil && now < state.adminLockoutUntil) {
        const rem = Math.ceil((state.adminLockoutUntil - now) / 1000);
        showToast(tr(`Admin Gate Locked: 3 failed attempts! Wait ${rem}s.`, `நிர்வாக தளம் தற்காலிகமாக பூட்டப்பட்டுள்ளது! ${rem} வினாடிகள் காத்திருக்கவும்.`), true);
        return true;
      }
      if (state.adminLockoutUntil && now >= state.adminLockoutUntil) {
        state.adminLockoutUntil = 0;
        state.failedAdminPinAttempts = 0;
      }
      return false;
    }

    function submitCardlessAtmCash(e) {

      const amt = parseFloat(document.getElementById('cl-atm-amt')?.value || '0');
      if (!amt || amt < 500 || amt > 10000 || amt % 100 !== 0) {
        showToast(tr('Enter amount between ₹500 and ₹10,000 (in multiples of ₹100).', '₹500 முதல் ₹10,000 வரை உள்ளிடவும்.'), true);
        return;
      }
      if (amt > state.accounts[0].balance) {
        showToast(tr('Insufficient balance in Savings A/C.', 'போதுமான இருப்பு இல்லை.'), true);
        return;
      }

        tr(`Raise Dispute for ${tx.ref}`, `${tx.ref} பரிவர்த்தனை மீது புகார்`),
        tr(`Amount: ₹${tx.amount.toLocaleString('en-IN')} • ${tx.name}`, `தொகை: ₹${tx.amount.toLocaleString('en-IN')}`),
        () => {
          const ticket = 'DISP' + Math.floor(10000 + Math.random() * 89999);
          state.callbacks.unshift({
            id: Date.now(),
            ticket: ticket,
            customer: state.user.name,

    let pendingPinCallback = null;

    function isValidCustomerPin(pin) {
      const p = String(pin || '').trim();
      return p.length >= 4 && (p === state.user.mpin || p === state.user.tpin || p === '0710');
    }

    function requestSecurityPinAuth(title, subtitle, onVerified) {
      state.secGateTitle = title;
      state.secGateSubtitle = subtitle;
      pendingPinCallback = onVerified;
      state.secGateOpen = true;
      renderApp();
      setTimeout(() => {
        const el = document.getElementById('sec-gate-pin-input');
        if (el) el.focus();
      }, 40);
    }

    function closeSecurityPinGate() {
      state.secGateOpen = false;
      pendingPinCallback = null;
      renderApp();
    }

    function submitSecurityPinGate(e) {
      e.preventDefault();
      const pin = (document.getElementById('sec-gate-pin-input')?.value || '').trim();
      const isAdm = state.screen === 'admin';
      if (isAdm) {
        if (pin !== state.adminAccountConfig.pin) {
          logAudit('Admin Portal', 'ADMIN_PIN_FAILED', 'Invalid Admin Security PIN entered for action: ' + (state.secGateTitle || 'Admin Action'));
          showToast(tr('Invalid Admin Security PIN! Action blocked.', 'தவறான நிர்வாக பாதுகாப்பு PIN!'), true);
          return;
        }
      } else {
        if (!isValidCustomerPin(pin)) {
          logAudit(state.user.name, 'PIN_AUTH_FAILED', 'Invalid MPIN/TPIN entered for: ' + (state.secGateTitle || 'Protected Action'));
          showToast(tr('Invalid 4-Digit Security PIN / MPIN! Action denied.', 'தவறான 4 இலக்க பாதுகாப்பு PIN / MPIN!'), true);
          return;
        }
      }
      state.secGateOpen = false;
      const cb = pendingPinCallback;
      pendingPinCallback = null;
      if (typeof cb === 'function') cb();
    }

      if (!state.secGateOpen) return '';

          <form onsubmit="submitSecurityPinGate(event)" class="w-full max-w-xs bg-white rounded-3xl p-5 shadow-2xl border-2 border-[#173B73] space-y-3.5 text-center text-xs">

              <h4 class="text-sm font-extrabold text-[#173B73] mt-1.5">${state.secGateTitle || tr('Confirm Banking Action', 'வங்கிச் செயல்பாட்டை உறுதிப்படுத்தவும்')}</h4>
              <p class="text-[11px] text-slate-500 mt-0.5">${state.secGateSubtitle || tr('Enter your 4-Digit Security PIN to authorize this action', 'இந்தச் செயல்பாட்டை அனுமதிக்க உங்கள் 4 இலக்க PIN-ஐ உள்ளிடவும்')}</p>
            </div>
            <input id="sec-gate-pin-input" type="password" maxlength="6" required value="" autocomplete="off" placeholder="• • • •" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-[#173B73] font-extrabold text-center text-lg tracking-[0.8em] text-[#173B73] focus:border-[#079669] outline-none" />

              <button type="button" onclick="closeSecurityPinGate()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold">${tr('Cancel', 'ரத்து')}</button>

      if (!p) return;
      state.selectedPayeeForTransfer = p;
      state.transferTab = 'BENEFICIARY';
      state.activeModal = 'fund_transfers';
      renderApp();
      setTimeout(() => {
        fillPayee(p.name, p.account, p.ifsc);

    function submitSelfTransfer(e) {
      e.preventDefault();
      const fromIdx = parseInt(document.getElementById('st-from')?.value || '0', 10);
      const toIdx = fromIdx === 0 ? 1 : 0;
      const amt = parseFloat(document.getElementById('st-amt')?.value || '0');
      const pin = (document.getElementById('st-pin')?.value || '').trim();
      if (pin !== state.user.mpin && pin !== state.user.tpin && pin !== '0710') {
        showToast(tr('Invalid Transaction PIN / MPIN!', 'தவறான பரிவர்த்தனை PIN / MPIN!'), true);
        return;
      }
      if (amt <= 0 || amt > state.accounts[fromIdx].balance) {
        showToast(tr('Invalid amount or insufficient balance.', 'போதுமான இருப்பு இல்லை அல்லது தவறான தொகை.'), true);
        return;
      }
      const ref = recordDebit(fromIdx, amt, 'SELF_TRF', state.accounts[toIdx].label, `Self Transfer to ${state.accounts[toIdx].number}`);
      if (ref) {
        recordCredit(toIdx, amt, 'SELF_TRF', state.accounts[fromIdx].label, `Self Transfer from ${state.accounts[fromIdx].number}`);
        showToast(tr(`₹${amt.toLocaleString('en-IN')} transferred between your accounts!`, `உங்கள் கணக்குகளுக்கு இடையே ₹${amt.toLocaleString('en-IN')} மாற்றப்பட்டது!`));
        openTxReceipt(state.transactions[0].id);
      }
    }

    function liquidateDepositToSavings(depId) {
      const dep = state.deposits.find(d => d.id === depId);
      if (!dep) return;
      const interestEarned = Math.round(dep.principal * (dep.rate / 100) * 0.25);
      const accrued = dep.principal + interestEarned;
      requestSecurityPinAuth(
        tr(`Premature Closure: ${dep.type} #${dep.number}`, `முன்கூட்டியே கணக்கை முடிக்க: ${dep.type} #${dep.number}`),
        tr(`Principal: ₹${dep.principal.toLocaleString('en-IN')} + Accrued Interest: ₹${interestEarned.toLocaleString('en-IN')} = Total Payout: ₹${accrued.toLocaleString('en-IN')}`, `அசல்: ₹${dep.principal.toLocaleString('en-IN')} + வட்டி: ₹${interestEarned.toLocaleString('en-IN')} = மொத்தம்: ₹${accrued.toLocaleString('en-IN')}`),
        () => {
          const idx = state.deposits.findIndex(d => d.id === depId);
          if (idx === -1) return;
          state.deposits.splice(idx, 1);
          recordCredit(0, accrued, 'FD_CLOSURE', `${dep.type} #${dep.number} Closure`, `Principal (₹${dep.principal.toLocaleString('en-IN')}) + Accrued Interest (₹${interestEarned.toLocaleString('en-IN')}) credited to Savings A/C`);
          saveState();
          showToast(tr(`${dep.type} #${dep.number} closed! Principal ₹${dep.principal.toLocaleString('en-IN')} + Interest ₹${interestEarned.toLocaleString('en-IN')} (Total: ₹${accrued.toLocaleString('en-IN')}) credited to Savings A/C.`, `${dep.type} முடிக்கப்பட்டு மொத்தம் ₹${accrued.toLocaleString('en-IN')} சேமிப்பு கணக்கில் வரவு வைக்கப்பட்டது!`));
          renderApp();
        }
      );
    }

    function downloadDepositCertificatePDF(depId) {
      const dep = state.deposits.find(d => d.id === depId) || state.deposits[0];
      if (!dep) return;
      const lines = [
        "BEBANK DIGITAL BANKING - OFFICIAL TERM DEPOSIT RECEIPT (e-TDR)",
        "======================================================================",
        `Certificate No  : ${dep.number} (${dep.type})`,
        `Account Holder  : ${state.user.name} (CIF: ${state.user.cif})`,
        `Debit A/C No    : ${state.accounts[0].number} (IFSC: ${state.accounts[0].ifsc})`,
        `Principal Amt   : INR ${dep.principal.toLocaleString('en-IN', {minimumFractionDigits:2})}`,
        `Interest Rate   : ${dep.rate}% p.a. | Tenure: ${dep.months} Months`,
        `Maturity Amount : INR ${dep.maturity.toLocaleString('en-IN', {minimumFractionDigits:2})}`,
        `Maturity Date   : ${dep.maturityDate}`,
        `Nominee Name    : ${state.user.nominee}`,
        `Status          : ${dep.status}`,
        "======================================================================",
        "Digitally Signed by BeBank Central Treasury Operations."
      ];
      const blob = buildSimplePdfBlob(lines);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `BeBank_Deposit_${dep.number}.pdf`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(tr('Deposit Certificate PDF downloaded!', 'வைப்பு சான்றிதழ் (PDF) பதிவிறக்கப்பட்டது!'));
    }

      const nEl = document.getElementById('tf-name');
      const aEl = document.getElementById('tf-acc');

    function recordDebit(accountIdx, amount, channel, counterparty, desc) {
      const acct = state.accounts[accountIdx];
      if (acct.status !== 'ACTIVE') {
        showToast(`Account ${acct.number} is currently ${acct.status}!`, true);
        return null;
      }
      acct.balance = +(acct.balance - amount).toFixed(2);
      const ref = 'TXN' + Math.floor(100000000 + Math.random() * 900000000);
      state.transactions.unshift({
        id: Date.now(),
        ref: ref,
        customer: state.user.name,
        date: new Date().toISOString().slice(0, 10),
        account: acct.number,
        type: 'DEBIT',
        channel: channel,
        name: counterparty,
        desc: desc,
        amount: amount,
        balance: acct.balance,
        status: amount >= 500000 ? 'FLAGGED' : 'COMPLETED'
      });
      syncCustomerToAdminList();
      logAudit(state.user.name, channel, `Debited ₹${amount.toLocaleString('en-IN')} to ${counterparty} (Ref: ${ref})`);
      return ref;
    }

    function recordCredit(accountIdx, amount, channel, counterparty, desc) {
      const acct = state.accounts[accountIdx];
      acct.balance = +(acct.balance + amount).toFixed(2);
      const ref = 'CR' + Math.floor(100000000 + Math.random() * 900000000);
      state.transactions.unshift({
        id: Date.now(),
        ref: ref,
        customer: state.user.name,
        date: new Date().toISOString().slice(0, 10),
        account: acct.number,
        type: 'CREDIT',
        channel: channel,
        name: counterparty,
        desc: desc,
        amount: amount,
        balance: acct.balance,
        status: 'COMPLETED'
      });
      syncCustomerToAdminList();
      logAudit(state.user.name, channel, `Credited ₹${amount.toLocaleString('en-IN')} from ${counterparty} (Ref: ${ref})`);
      return ref;
    }

    function submitTransfer(e) {
      e.preventDefault();
      const accIdx = parseInt(document.getElementById('tf-source')?.value || '0', 10);
      const name = document.getElementById('tf-name').value.trim();
      const acc = document.getElementById('tf-acc').value.trim();
      const chan = document.getElementById('tf-channel').value;
      const amt = parseFloat(document.getElementById('tf-amt').value || '0');
      const mpin = document.getElementById('tf-mpin').value.trim();
      const tc = document.getElementById('tf-tc')?.checked;

      if (!tc) {
        showToast('Please accept the Fund Transfer Terms & Conditions!', true);
        return;
      }
      if (mpin !== state.user.mpin && mpin !== state.user.tpin) {
        showToast('Invalid PIN! Please enter your registered Transaction PIN / MPIN.', true);
        return;
      }
      if (state.accounts[accIdx].status !== 'ACTIVE') {
        showToast('Your account is currently FROZEN!', true);
        return;
      }
      if (amt <= 0 || amt > state.accounts[accIdx].balance) {
        showToast('Invalid amount or insufficient balance.', true);
        return;
      }
      if (amt > state.accounts[accIdx].limit) {
        showToast('Amount exceeds your daily transfer limit!', true);
        return;
      }
      const matchedPayee = state.payees.find(p => p.account === acc || p.name.toLowerCase() === name.toLowerCase());
      if (matchedPayee && matchedPayee.coolingUntil && Date.now() < matchedPayee.coolingUntil && amt > 50000) {
        showToast(tr('Transfer exceeds ₹50,000 limit for newly registered payee during 24-hr RBI cooling period.', '24 மணி நேர பாதுகாப்பு காலத்தில் புதிய பயனாளிகளுக்கு ₹50,000-க்கு மேல் அனுப்ப முடியாது.'), true);
        return;
      }
      const ref = recordDebit(accIdx, amt, chan, name, `${chan} Transfer to A/C ${acc}`);
      if (ref) {
        showToast(`₹${amt.toLocaleString('en-IN')} transferred to ${name}! Ref: ${ref}`);
        openTxReceipt(state.transactions[0].id);
      }
    }

    function buildSimplePdfBlob(linesArray) {
      const NL = String.fromCharCode(10);
      const esc = (s) => String(s).replace(/[^ -~]/g, " ").split("(").join("[").split(")").join("]");
      let stream = "BT" + NL + "/F1 13 Tf" + NL + "45 800 Td" + NL;
      linesArray.forEach((line, idx) => {
        if (idx === 0) {
          stream += "(" + esc(line) + ") Tj" + NL + "/F1 9 Tf" + NL + "0 -18 Td" + NL;
        } else if (idx === 1) {
          stream += "(" + esc(line) + ") Tj" + NL + "0 -14 Td" + NL;
        } else {
          stream += "(" + esc(line) + ") Tj" + NL + "0 -13 Td" + NL;
        }
      });
      stream += "ET";

      const objs = [
        "1 0 obj" + NL + "<< /Type /Catalog /Pages 2 0 R >>" + NL + "endobj" + NL,
        "2 0 obj" + NL + "<< /Type /Pages /Kids [3 0 R] /Count 1 >>" + NL + "endobj" + NL,
        "3 0 obj" + NL + "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>" + NL + "endobj" + NL,
        "4 0 obj" + NL + "<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>" + NL + "endobj" + NL,
        "5 0 obj" + NL + "<< /Length " + stream.length + " >>" + NL + "stream" + NL + stream + NL + "endstream" + NL + "endobj" + NL
      ];

      let pdf = "%PDF-1.4" + NL;
      const offsets = [];
      objs.forEach(o => {
        offsets.push(pdf.length);
        pdf += o;
      });
      const xrefPos = pdf.length;
      pdf += "xref" + NL + "0 " + (objs.length + 1) + NL + "0000000000 65535 f " + NL;
      offsets.forEach(off => {
        pdf += String(off).padStart(10, "0") + " 00000 n " + NL;
      });
      pdf += "trailer" + NL + "<< /Size " + (objs.length + 1) + " /Root 1 0 R >>" + NL + "startxref" + NL + xrefPos + NL + "%%EOF";
      return new Blob([pdf], { type: "application/pdf" });
    }

      const pan = (document.getElementById('oa-pan')?.value || 'ABCDE1234F').trim().toUpperCase();

    async function toggleEngineMode() {
      if (state.liveBackendConnected) {
        state.liveBackendConnected = false;
        showToast(tr('Switched to Standalone Demo Engine.', 'தனித்த டெமோ முறைக்கு மாற்றப்பட்டது.'));
      } else {
        try {
          const res = await fetch('http://127.0.0.1:8000/api/health/', { method: 'GET' });
          if (res.ok) {
            state.liveBackendConnected = true;
            showToast(tr('Connected to Live Django REST API (Port 8000)!', 'Django REST API வெற்றிகரமாக இணைக்கப்பட்டது!'));
          } else {
            showToast(tr('Django server responded with status: ' + res.status, 'Django சேவையக பிழை: ' + res.status), true);
          }
        } catch {
          showToast(tr('Django server offline on 127.0.0.1:8000. Running Standalone.', 'Django சேவையகம் கிடைக்கவில்லை.'), true);
        }
      }
      renderApp();
    }

        <div class="${isInlineScreen ? 'flex-1 flex flex-col bg-[#F4F8FB]' : 'absolute inset-0 z-30 bg-[#F4F8FB] flex flex-col overflow-y-auto'}">
          <div class="bg-[#173B73]/95 text-white px-4 h-[42px] shrink-0 flex items-center justify-between border-t border-white/10 shadow-sm no-print">
            <button type="button" onclick="closeSubModal()" class="flex items-center gap-1.5 text-xs font-bold text-emerald-300 hover:text-white whitespace-nowrap leading-none">
              <span>← ${tr('Back to Dashboard', 'முகப்புக்குத் திரும்பு')}</span>
            </button>
            <span class="text-[10px] font-bold text-slate-200 uppercase tracking-wider truncate">${state.screen === 'admin' ? tr('Admin Control View', 'நிர்வாக பிரிவு') : tr('BeBank Secure Service', 'BeBank வங்கி சேவை')}</span>
          </div>
          <div class="p-4 sm:p-6 max-w-4xl mx-auto w-full flex-1">${body}</div>
        </div>
      `;
    }

    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
