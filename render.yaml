services:
  - type: web
    name: bebank-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_bebank
    startCommand: gunicorn bebank_core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DEMO_BANKING_MODE
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true

  - type: web
    name: bebank-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
