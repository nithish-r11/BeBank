version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: bebank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bebank_db}
      POSTGRES_USER: ${DB_USER:-bebank_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bebank_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bebank_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bebank_db}
      DB_USER: ${DB_USER:-bebank_user}
      DB_PASSWORD: ${DB_PASSWORD:-bebank_secure_pass_2026}
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bebank_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
